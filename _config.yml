# ─────────────────────────────────────────────────────────────
#  阅藏经 · Yuezangjing — Jekyll 站点配置
#  部署: GitHub Pages (Actions)
# ─────────────────────────────────────────────────────────────

# 站点基本信息
title: 阅藏经
subtitle: 次第禅心 · 遍阅大藏
tagline: 阅藏经
description: >-
  阅藏经是一个开放的中文佛学阅读站点，收录大藏经要典、禅宗典籍与近代佛学著作，
  以「经 / 录 / 论」三部合一的结构，呈现可检索、可标注、可共读的经典文本。
description_short: 遍阅大藏经 · 禅宗典籍 · 近代佛学著作

# 部署地址。若部署在 <user>.github.io/<repo>，请把 baseurl 改为 "/<repo>"
url: "https://yuezangjing.github.io"
baseurl: ""

author: 阅藏经编委会
email: contact@yuezangjing.org
lang: "zh-CN"
timezone: Asia/Shanghai

# 品牌标识（用于页眉印章与 favicon）
seal_char: 藏
logo_text: 阅藏经

# SEO / 社交
social:
  name: 阅藏经
  description: "次第禅心，遍阅大藏"
  links:
    - title: GitHub
      url: "https://github.com/yuezangjing/yuezangjing"
    - title: RSS
      url: "/feed.xml"

# ─────────────────────────────────────────────────────────────
#  集合 (Collections)
# ─────────────────────────────────────────────────────────────
collections:
  sutra:
    output: true
    permalink: /read/:path/

defaults:
  - scope:
      path: ""
      type: sutra
    values:
      layout: reading
  - scope:
      path: ""
    values:
      layout: default

# ─────────────────────────────────────────────────────────────
#  插件
# ─────────────────────────────────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

# ─────────────────────────────────────────────────────────────
#  变量（供模板引用）
# ─────────────────────────────────────────────────────────────
site_stats:
  canon_volumes: 8083        # 大藏经总卷数（分类统计合计）
  canon_parts: 2066          # 大藏经总部数
  tradition: 禅门              # 站点宗风标识
  motto: 行到水穷处，坐看云起时

# ─────────────────────────────────────────────────────────────
#  构建
# ─────────────────────────────────────────────────────────────
sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .gemhome
  - .home
  - scripts
  - README.md
  - LICENSE
  - .github
  - node_modules

keep_files:
  - .git
