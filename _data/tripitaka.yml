      note: 藏经主体
    - name: 大乘法论
      parts: 366
      volumes: 1761
      tag: 论
      scope: 唯识、中观、显宗、如来藏诸系义论
      note: 义学纲领
    - name: 单译经
      parts: 173
      volumes: 736
      tag: 经
      scope: 单经别行、疑伪失译之属
      note: 别行流通
    - name: 小乘经
      parts: 227
      volumes: 619
      tag: 经
      scope: 阿含四部、涅槃、增一、杂藏
      note: 早期结集
    - name: 律
      parts: 61
      volumes: 518
      tag: 律
      scope: 四分律、根本说一切有部毗奈耶等
      note: 戒行法门
    - name: 小乘法论
      parts: 61
      volumes: 192
      tag: 论
      scope: 俱舍、顺正、显宗、阿毗昙诸论
