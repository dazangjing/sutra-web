      parts: 9
      volumes: 110
      tag: 杂
      scope: 瑜伽师地、起世、菩萨本行等别行部
      note: 附载别集

# 二、历代刻藏概览
canons:
  title: 历代大藏经刻藏概览
  caption: 自辽宋以降诸大藏经刊刻流布情形
  rows:
    - name: 房山石经
      dynasty: 辽
      year: 1030–1071
      parts: "—"
      volumes: "七百余函"
      feature: 石刻藏经，四部备具，现存辽代刻本最多者
    - name: 契丹藏
      dynasty: 辽
      year: 1038–1071
      parts: "—"
      volumes: "约六千五百"
      feature: 契丹藏经院刊刻，卷首千字文帙号
    - name: 崇宁藏
      dynasty: 北宋
      year: 1103–1110
      parts: "五千余"
      volumes: "—"
      feature: 雕版千字文帙号，后附《法苑珠林》等藏外典籍
    - name: 碛砂藏
      dynasty: 南宋
      year: 1238–1252
      parts: "约一千一百"
      volumes: "六千余"
      feature: 思溪开元禅寺发起，卷首千字文帙号绵延至今
    - name: 普宁藏
      dynasty: 元
      year: 1285–1295
      parts: "一千余"
      volumes: "—"
      feature: 杭州路佛智普宁寺重刻，后归入《碛砂藏》续刻
    - name: 毗卢藏
      dynasty: 明
      year: 1404–1447
      parts: "约一千四百六十"
      volumes: "约六千三百六十"
      feature: 北京万寿寺刊刻，后世通称「北藏」之本
    - name: 永乐北藏
      dynasty: 明
      year: 1403–1408
      parts: "636"
      volumes: "6360"
      feature: 明官修大藏经，写本为主，装帧最精
    - name: 永乐南藏
      dynasty: 明
      year: 1414–1431
      parts: "636"
      volumes: "6360"
      feature: 安置于南京报恩寺，与北藏同帙号而增刻藏外
    - name: 嘉兴藏
      dynasty: 明
      year: 1624–1636
      parts: "1654"
      volumes: "7168"
      feature: 径山万寿禅院刊刻，收经最多且附刻宗说
    - name: 龙藏
      dynasty: 清
      year: 1733–1738
      parts: "1669"
      volumes: "7240"
      feature: 北京卧佛寺藏经馆刊刻，殿版写本
    - name: 频伽藏
      dynasty: 清
      year: 1909–1913
      parts: "—"
      volumes: "7168"
      feature: 上海频伽精舍铅印缩印，广为流通
    - name: 高丽大藏经
      dynasty: 高丽
      year: 1011–1248
      parts: "一千五百余"
      volumes: "八万卷帙"
      feature: 八万大藏经，续雕本世称高丽藏
    - name: 弘教大藏经
      dynasty: 日本
      year: 1560–1641
      parts: "约六百五十"
      volumes: "七千余"
      feature: 日本高田明寺藏，开版印行流通至今

