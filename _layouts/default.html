<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
{% include head.html %}
<body class="{% if page.body_class %}{{ page.body_class }} {% endif %}layout-{{ page.layout | default: 'default' }}">

<div class="bg-layer" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-aurora"></div>
  <canvas class="bg-dust" id="dustCanvas"></canvas>
  <div class="bg-noise"></div>
</div>

<a class="skip-link" href="#main">跳到正文</a>

<div class="reading-progress" id="readingProgress" aria-hidden="true"><i></i></div>

{% include header.html %}

<main class="site-main" id="main">
  {{ content }}
</main>

{% include footer.html %}

<button class="to-top" id="toTop" type="button" aria-label="回到顶部">
  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V5M4.5 10.5 10 5l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

{% include scripts.html %}
</body>
</html>
