[package]
name = "yuezangjing-desktop"
version = "0.1.0"
description = "阅藏经 · 桌面端"
authors = ["阅藏经"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "yuezangjing_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
encoding_rs = "0.8"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
