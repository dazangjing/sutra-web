<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  {%- seo %}
  {%- if page.summary or page.description %}
  <meta name="description" content="{{ page.summary | default: page.description | default: site.description_short | strip_html | normalize_whitespace | truncate: 160 }}">
  {%- endif %}

  <meta name="theme-color" content="#07090c">
  <meta name="color-scheme" content="dark light">
  <meta name="format-detection" content="telephone=no">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="{% if page.collection == 'sutra' %}article{% else %}website{% endif %}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/seal.svg' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="preload" as="style" href="{{ '/assets/css/main.css' | relative_url }}">

  {%- if page.collection == 'sutra' %}
  <meta property="article:section" content="{{ page.category }}">
  {%- endif %}
</head>
